name: Validate TypeScript

on:
  push:
    branches: [ main ]
    paths:
      - 'typescript/**/*.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/build.ts'
  pull_request:
    branches: [ main ]
    paths:
      - 'typescript/**/*.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/build.ts'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.bun/install/cache
          node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('package.json', 'bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Validate TypeScript compilation
      run: tsc --noEmit

    - name: Test build process
      run: bun run build

    - name: Verify build outputs
      run: |
        echo "✅ TypeScript validation and build test completed"
        ls -la src/starhtml/static/js/plugins/
        ls -la src/starhtml/static/js/debugger/
        echo "Built plugin files:"
        find src/starhtml/static/js/plugins -name "*.js" -exec echo "  {}" \;
        echo "Built debugger files:"
        find src/starhtml/static/js/debugger -type f \( -name "*.js" -o -name "*.css" \) -exec echo "  {}" \;
