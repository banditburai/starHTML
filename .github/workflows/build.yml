name: Validate TypeScript

on:
  push:
    branches: [ main ]
    paths:
      - 'typescript/**/*.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/build.ts'
      - 'scripts/build_datastar.py'
      - 'patches/datastar-upstream.js'
      - 'patches/patch_definitions.py'
  pull_request:
    branches: [ main ]
    paths:
      - 'typescript/**/*.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/build.ts'
      - 'scripts/build_datastar.py'
      - 'patches/datastar-upstream.js'
      - 'patches/patch_definitions.py'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.bun/install/cache
          node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('package.json', 'bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Validate TypeScript compilation
      run: tsc --noEmit

    - name: Test build process
      run: bun run build

    - name: Verify build outputs
      run: |
        echo "✅ TypeScript validation and build test completed"
        ls -la src/starhtml/static/js/plugins/
        ls -la src/starhtml/static/js/devtools/
        echo "Built plugin files:"
        find src/starhtml/static/js/plugins -name "*.js" -exec echo "  {}" \;
        echo "Built devtools files:"
        find src/starhtml/static/js/devtools -type f \( -name "*.js" -o -name "*.css" \) -exec echo "  {}" \;

        # Verify datastar.js
        if [ ! -f "src/starhtml/static/js/datastar.js" ]; then
          echo "❌ datastar.js not found in build output"
          exit 1
        fi
        size=$(stat -c%s "src/starhtml/static/js/datastar.js")
        echo "✅ datastar.js ($size bytes)"

    - name: Verify datastar patches
      run: python patches/verify_datastar_patches.py
