name: Test Release Process (Dry Run)

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  test-release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get current version and calculate next version
      id: version
      run: |
        echo "🧪 TEST MODE - No changes will be made"
        echo "==========================================="
        
        # Get current version from pyproject.toml
        CURRENT_VERSION=$(grep "^version = " pyproject.toml | cut -d'"' -f2)
        echo "Current version from pyproject.toml: '$CURRENT_VERSION'"
        
        # Debug: Show the raw grep output
        echo "Raw grep output:"
        grep "^version = " pyproject.toml
        
        # Validate current version format
        if [ -z "$CURRENT_VERSION" ]; then
          echo "❌ Error: Could not extract version from pyproject.toml"
          echo "Content of pyproject.toml (first 10 lines):"
          head -10 pyproject.toml
          exit 1
        fi
        
        if ! [[ "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "❌ Error: Current version '$CURRENT_VERSION' is not in X.Y.Z format"
          exit 1
        fi
        
        # Split version into components
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
        echo "Version components: MAJOR=$MAJOR, MINOR=$MINOR, PATCH=$PATCH"
        
        # Calculate new version based on release type
        RELEASE_TYPE="${{ inputs.release_type }}"
        case $RELEASE_TYPE in
          major)
            NEW_MAJOR=$((MAJOR + 1))
            NEW_MINOR=0
            NEW_PATCH=0
            ;;
          minor)
            NEW_MAJOR=$MAJOR
            NEW_MINOR=$((MINOR + 1))
            NEW_PATCH=0
            ;;
          patch)
            NEW_MAJOR=$MAJOR
            NEW_MINOR=$MINOR
            NEW_PATCH=$((PATCH + 1))
            ;;
        esac
        
        NEW_VERSION="$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"
        
        echo ""
        echo "╔════════════════════════════════════════╗"
        echo "║          Release Summary               ║"
        echo "╠════════════════════════════════════════╣"
        echo "║ Current version: $CURRENT_VERSION"
        echo "║ Release type:    $RELEASE_TYPE"
        echo "║ New version:     $NEW_VERSION"
        echo "╚════════════════════════════════════════╝"
        
        # Output for later steps
        echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT
    
    - name: Simulate version validation
      run: |
        VERSION="v${{ steps.version.outputs.new }}"
        echo "🧪 Would create tag: $VERSION"
        
        if [ -z "${{ steps.version.outputs.new }}" ]; then
          echo "❌ Error: Version is empty!"
          echo "GitHub output 'new' = '${{ steps.version.outputs.new }}'"
          exit 1
        fi
        
        echo "✅ Version validation passed"
        echo "Tag that would be created: $VERSION"
    
    - name: Show what would happen
      run: |
        echo "📋 Actions that would be performed:"
        echo "1. Update pyproject.toml from ${{ steps.version.outputs.current }} to ${{ steps.version.outputs.new }}"
        echo "2. Commit with message: 'chore: bump version to ${{ steps.version.outputs.new }}'"
        echo "3. Push to main branch"
        echo "4. Create tag: v${{ steps.version.outputs.new }}"
        echo "5. Push tag to trigger release workflow"
        echo ""
        echo "✅ All checks passed! Safe to run the actual release workflow."